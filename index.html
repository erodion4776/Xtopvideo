<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to Video Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.min.js"></script>
</head>
<body>
    <div class="app">
        <!-- ===== LEFT: HTML EDITOR ===== -->
        <aside class="sidebar">
            <header class="app-header">
                <h1>🎬 HTML → Video</h1>
                <p>Paste your HTML design, upload audio, export video</p>
            </header>

            <!-- Project Name -->
            <section class="card">
                <label>📝 Project Name</label>
                <input type="text" id="projectName" value="my-video" placeholder="Project name (used for filename)">
            </section>

            <!-- Audio Upload -->
            <section class="card">
                <h3>🎵 1. Upload Audio</h3>
                <div class="drop-zone" id="dropZone">
                    <span id="dropZoneText">📁 Click to upload audio</span>
                </div>
                <input type="file" id="audioInput" accept="audio/*" hidden>
                <div id="audioMeta" class="meta hidden"></div>
            </section>

            <!-- Video Settings -->
            <section class="card">
                <h3>📐 2. Video Size</h3>
                <select id="aspectRatio">
                    <option value="1920x1080">🖥️ 1920 × 1080 (16:9 Landscape)</option>
                    <option value="1080x1920">📱 1080 × 1920 (9:16 Vertical)</option>
                    <option value="1080x1080">🟦 1080 × 1080 (Square)</option>
                    <option value="1280x720">🖥️ 1280 × 720 (HD 720p)</option>
                </select>
                <label style="margin-top:8px;">Frame Rate</label>
                <select id="fps">
                    <option value="24">24 FPS (Film)</option>
                    <option value="30" selected>30 FPS (Standard)</option>
                    <option value="60">60 FPS (Smooth)</option>
                </select>
            </section>

            <!-- Save/Load Projects -->
            <section class="card">
                <h3>💾 3. My Projects</h3>
                <div class="btn-row">
                    <button id="saveBtn" class="btn btn-secondary">💾 Save</button>
                    <button id="newBtn" class="btn btn-secondary">➕ New</button>
                    <button id="showProjectsBtn" class="btn btn-secondary">📂 Load</button>
                </div>
                <div id="projectsList" class="projects-list hidden"></div>
            </section>

            <!-- Template Examples -->
            <section class="card">
                <h3>💡 4. Load Example Template</h3>
                <select id="exampleTemplate">
                    <option value="">-- Choose Example --</option>
                    <option value="memorial">🕊️ Memorial Tribute</option>
                    <option value="karaoke">🎤 Karaoke Lyrics</option>
                    <option value="tiktok">📱 TikTok Style</option>
                    <option value="quote">💬 Quote Card</option>
                    <option value="podcast">🎙️ Podcast Clip</option>
                </select>
                <button id="loadExampleBtn" class="btn btn-primary" style="margin-top:8px;width:100%;">Load Template</button>
            </section>

            <!-- Export -->
            <section class="card">
                <h3>🎬 5. Export</h3>
                <select id="exportFormat">
                    <option value="mp4" selected>MP4 (HD Quality)</option>
                    <option value="webm">WebM (Faster)</option>
                </select>
                <button id="exportBtn" class="btn btn-export" disabled>🎬 Export Video</button>
            </section>
        </aside>

        <!-- ===== CENTER: HTML CODE EDITOR ===== -->
        <main class="editor-area">
            <div class="editor-header">
                <h3>✏️ Paste Your HTML Design</h3>
                <div class="editor-tools">
                    <button id="formatBtn" class="btn btn-secondary">🎨 Beautify</button>
                    <button id="clearBtn" class="btn btn-secondary">🗑️ Clear</button>
                    <button id="applyBtn" class="btn btn-primary">▶ Apply & Preview</button>
                </div>
            </div>
            <textarea id="htmlEditor" spellcheck="false" placeholder="Paste your complete HTML here...

Example:
<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: black; color: white; }
        /* your CSS here */
    </style>
</head>
<body>
    <h1>Your Content</h1>
    <script>
        // Your captions array
        const captions = [
            { start: 0, end: 3, text: 'Hello' },
            { start: 3, end: 6, text: 'World' }
        ];
    </script>
</body>
</html>"></textarea>
        </main>

        <!-- ===== RIGHT: LIVE PREVIEW ===== -->
        <section class="preview-area">
            <div class="preview-header">
                <h3>👀 Live Preview</h3>
                <span id="previewStatus" class="status">Waiting for HTML...</span>
            </div>

            <div class="preview-frame-wrap">
                <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>

            <!-- Player Controls -->
            <div class="player">
                <button id="playBtn" class="play-btn" disabled>▶</button>
                <span id="timeDisplay">0:00 / 0:00</span>
                <input type="range" id="scrubber" min="0" max="100" value="0" step="0.05">
            </div>

            <canvas id="exportCanvas" hidden></canvas>
        </section>

        <!-- Export Modal -->
        <div id="exportModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="exportTitle">Exporting...</h3>
                <div class="progress-outer">
                    <div id="exportProgress" class="progress-inner"></div>
                </div>
                <p id="exportDetail">Preparing...</p>
                <button id="cancelExportBtn" class="btn btn-secondary" style="margin-top:14px;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="examples.js"></script>
    <script src="app.js"></script>
</body>
</html>
